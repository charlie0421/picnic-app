workflows:
  # =================== PICNIC APP iOS ===================
  picnic-app-ios:
    name: Picnic App - iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic-picnic
    environment:
      groups:
        - app_store_connect
        - shorebird-config
        - picnic_env
        - sentry-config
      flutter: 3.41.4
      xcode: 26.3
      cocoapods: default
      vars:
        APP_NAME: "picnic_app"
        BUNDLE_ID: "io.iconcasting.picnic.app"
        FLUTTER_VERSION: "3.41.4"
        ENABLE_SHOREBIRD: "true"
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'picnic-v*'
          include: true
        - pattern: 'picnic-staging-v*'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Derive the deploy target from the release tag
        script: |
          set -e
          # The tag decides the target, so there is no run-time variable a human
          # can forget to set:
          #   picnic-staging-v*  -> staging
          #   picnic-v*          -> production
          # The two patterns cannot both match the same tag: `picnic-staging-v1.2.3`
          # does not match `picnic-v*`.
          #
          # CM_TAG is Codemagic's built-in variable, documented as "The tag being
          # built if started from a tag webhook, unset otherwise", so requiring it
          # stops a non-tag build from guessing a target.
          # https://docs.codemagic.io/yaml-basic-configuration/environment-variables/
          : "${CM_TAG:?is unset; this workflow only runs from a release tag}"
          case "$CM_TAG" in
            picnic-staging-v*)
              DEPLOY_TARGET=staging
              ;;
            picnic-v*)
              DEPLOY_TARGET=production
              ;;
            *)
              echo "Tag '$CM_TAG' maps to no deploy target; expected picnic-v* or picnic-staging-v*" >&2
              exit 1
              ;;
          esac
          : "${DEPLOY_TARGET:?was not derived from the tag; refusing to guess a deploy target}"
          echo "DEPLOY_TARGET=$DEPLOY_TARGET" >> "$CM_ENV"
          echo "Deploy target: $DEPLOY_TARGET (from tag $CM_TAG)"
      - name: Verify environment isolation policy
        script: |
          set -e
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 test_codemagic_environment_isolation.py
          python3 test_codemagic_environment_isolation.py --self-test
      - name: Verify protected production target when requested
        script: |
          # set -e: a NO-GO from the guard must fail the step, not be discarded.
          set -e
          # Assert the *propagated* value too. If the `$CM_ENV` hand-off from the
          # derivation step ever breaks, DEPLOY_TARGET is empty here and the test
          # below would silently take the staging branch.
          : "${DEPLOY_TARGET:?was not propagated from the tag-derivation step}"
          if [ "$DEPLOY_TARGET" = "production" ]; then
            # Tag builds check out a detached clone with no main ref, so the
            # guard's main-ancestry check cannot see main without this fetch.
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            cd picnic_app
            dart run tool/verify_release_target.dart --target=production
          fi
      - name: Run picnic_app release guard tests
        script: |
          set -e
          # The release-target and environment-isolation guards live in
          # picnic_app/test/config. picnic_lib's suite never loads them, so
          # without this step they would rot unnoticed until a release broke.
          # Runs after verify_release_target.dart on purpose: that guard requires
          # a clean checkout, and `flutter test` implies a pub get that can touch
          # the tracked pubspec.lock.
          cd picnic_app
          flutter test
      - name: Get Flutter packages and prepare iOS
        script: |
          # set -e: verify_environment_isolation.dart below is not the last
          # command in this step, so without it a NO-GO exit status would be
          # overwritten by the trailing `flutter`/`ls` commands and the build
          # would keep going and publish a mis-targeted app.
          set -e
          # Assert the *propagated* value too: an empty DEPLOY_TARGET would take
          # the staging branch below instead of stopping the build.
          : "${DEPLOY_TARGET:?was not propagated from the tag-derivation step}"
          cd picnic_app

          # Staging build only: rewrite dev.json to the staging Supabase target
          # and prove non-production isolation. The production deploy path must
          # not depend on staging secrets, so it is skipped entirely.
          if [ "$DEPLOY_TARGET" != "production" ]; then
            : "${PICNIC_STAGING_SUPABASE_URL:?PICNIC_STAGING_SUPABASE_URL is required}"
            : "${PICNIC_STAGING_SUPABASE_ANON_KEY:?PICNIC_STAGING_SUPABASE_ANON_KEY is required}"
            : "${PICNIC_STAGING_SUPABASE_PROJECT_REF:?PICNIC_STAGING_SUPABASE_PROJECT_REF is required}"
            jq --arg url "$PICNIC_STAGING_SUPABASE_URL" \
              --arg key "$PICNIC_STAGING_SUPABASE_ANON_KEY" \
              '.supabase.url=$url | .supabase.anon_key=$key | .supabase.storage.url=($url + "/storage/v1") | .supabase.storage.anon_key=$key' \
              config/prod.json > config/dev.json
            PANGLE_ENVIRONMENT=sandbox \
              PAYMENT_ENVIRONMENT=sandbox \
              PICNIC_PANGLE_IOS_APP_ID= \
              PICNIC_PANGLE_ANDROID_APP_ID= \
              PICNIC_PANGLE_IOS_REWARDED_ID= \
              PICNIC_PANGLE_ANDROID_REWARDED_ID= \
              dart run tool/verify_environment_isolation.dart --environment=dev
          fi

          echo "=== Flutter 패키지 설치 ==="
          flutter packages pub get

          echo "=== Flutter iOS 설정 생성 ==="
          flutter precache --ios
          flutter build ios --config-only

          echo "=== Generated.xcconfig 파일 확인 ==="
          ls -la ios/Flutter/Generated.xcconfig || echo "⚠️ Generated.xcconfig 파일이 아직 생성되지 않음"

      - name: Run unit tests with coverage
        script: |
          cd picnic_lib
          flutter test --coverage
          python3 scripts/filter_coverage.py \
            --exclude-list coverage/exclude_patterns.txt \
            --input coverage/lcov.info \
            --output coverage/lcov_filtered.info
        test_report: picnic_lib/build/test-results/**/*.xml

      - name: Install CocoaPods dependencies
        script: |
          cd picnic_app/ios

          echo "=== Podfile.lock 삭제 (새로 설치) ==="
          rm -rf Podfile.lock Pods

          echo "=== CocoaPods 설치 ==="
          pod install --repo-update

      - name: Install Shorebird CLI
        script: |
          if [ "${ENABLE_SHOREBIRD:-false}" != "true" ]; then
            echo "⏭️ Skipping Shorebird (disabled)"
            exit 0
          fi
          echo "=== Shorebird CLI 설치 ==="
          rm -rf "$HOME/.shorebird"
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash

          # 바이너리 존재 확인만 (--version은 Flutter 다운로드로 오래 걸림)
          if [ -f "$HOME/.shorebird/bin/shorebird" ]; then
            echo "✅ Shorebird 설치 완료"
          else
            echo "❌ Shorebird 설치 실패"
            exit 1
          fi

      - name: Set up iOS code signing (auto-create)
        script: |
          set -e
          echo "=== iOS 서명 파일 자동 준비 (없으면 생성) ==="
          # App Store Connect API 키로 배포 인증서/프로파일을 가져오고, 없으면 --create 로 생성.
          # 인증서/프로파일 만료 시 매년 수동 생성 없이 CI가 자동 갱신.
          keychain initialize
          # 영속 개인키(CERTIFICATE_PRIVATE_KEY)로 배포 인증서를 생성/재사용한다.
          # 계정의 "Distribution Managed" 인증서는 개인키가 없어 CI가 못 쓰므로,
          # Codemagic이 자기 키로 만든 인증서를 쓴다(한 번 만들면 매 빌드 재사용 → 한도 문제 없음).
          app-store-connect fetch-signing-files "io.iconcasting.picnic.app" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create \
            --delete-stale-profiles
          keychain add-certificates

          # 방금 가져온/생성한 app_store 프로비저닝 프로파일 이름을 추출해 다음 단계로 전달.
          # Codemagic은 프로파일을 Xcode UserData 경로에 저장한다(구형 MobileDevice 경로도 fallback).
          LATEST_PROFILE=$(ls -t \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
            2>/dev/null | head -1)
          if [ -z "$LATEST_PROFILE" ]; then
            echo "❌ 프로비저닝 프로파일을 찾을 수 없음 (자동 생성 실패 — App Store Connect API 키 권한 확인)"
            exit 1
          fi
          security cms -D -i "$LATEST_PROFILE" > /tmp/profile.plist
          SIGNING_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          echo "✅ 사용할 프로파일: $SIGNING_PROFILE_NAME"
          echo "SIGNING_PROFILE_NAME=$SIGNING_PROFILE_NAME" >> "$CM_ENV"

          # 아카이브(xcodebuild)가 구형 경로도 참조할 수 있으므로 프로파일을 양쪽에 둔다
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$LATEST_PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || true

      - name: Verify iOS Signing Configuration
        script: |
          echo "=== iOS 서명 환경 확인 ==="
          echo "DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM:-'24SL34R9HR'}"
          
          # Distribution Certificate 정보 확인
          DIST_CERT_INFO=$(security find-identity -v -p codesigning | grep -i distribution | head -1)
          if [ -n "$DIST_CERT_INFO" ]; then
            echo "✅ Distribution 인증서: $DIST_CERT_INFO"
          else
            echo "❌ Distribution 인증서를 찾을 수 없음"
            echo "사용 가능한 인증서들:"
            security find-identity -v -p codesigning
            exit 1
          fi
          
          # Provisioning Profile 정보 확인
          PROFILE_COUNT=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" 2>/dev/null | wc -l)
          echo "설치된 프로비저닝 프로파일 개수: $PROFILE_COUNT개"
          
          if [ "$PROFILE_COUNT" -gt 0 ]; then
            echo "✅ 프로비저닝 프로파일 목록:"
            find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" 2>/dev/null | while read profile; do
              PROFILE_NAME=$(security cms -D -i "$profile" 2>/dev/null | grep -A1 "<key>Name</key>" | tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | tr -d '\n')
              echo "  - $(basename "$profile" .mobileprovision): $PROFILE_NAME"
              
              # 프로비저닝 프로파일의 Entitlements 확인
              if [[ "$PROFILE_NAME" == *"picnic"* ]]; then
                echo "    🔍 Picnic 프로파일 Entitlements 확인 중..."
                ENTITLEMENTS=$(security cms -D -i "$profile" 2>/dev/null | grep -A 20 "<key>Entitlements</key>" | grep -E "(aps-environment|com.apple.developer.associated-domains|com.apple.developer.applesignin)")
                if [ -n "$ENTITLEMENTS" ]; then
                  echo "    ✅ 필요한 Entitlements 발견:"
                  echo "$ENTITLEMENTS" | head -5
                else
                  echo "    ⚠️ 필요한 Entitlements가 누락됨 (Associated Domains, Push Notifications, Sign in with Apple)"
                fi
              fi
            done
          else
            echo "❌ 프로비저닝 프로파일을 찾을 수 없음"
            exit 1
          fi

      - name: Configure Manual Distribution Signing
        script: |
          cd picnic_app/ios
          
          echo "=== Runner 타겟만 Manual Distribution Signing 설정 ==="
          echo "🎯 CocoaPods 의존성 충돌 해결: Runner만 Manual, Pods는 Automatic 유지"
          
          # Runner.xcodeproj만 수정 (Pods.xcodeproj는 건드리지 않음)
          echo "📝 Runner 타겟: Manual Distribution Signing 활성화..."
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" Runner.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_STYLE = \"\";/CODE_SIGN_STYLE = Manual;/g" Runner.xcodeproj/project.pbxproj
          
          # Development Team 설정 (Runner만)
          sed -i '' "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = \"24SL34R9HR\";/g" Runner.xcodeproj/project.pbxproj
          sed -i '' "s/DEVELOPMENT_TEAM = 24SL34R9HR;/DEVELOPMENT_TEAM = \"24SL34R9HR\";/g" Runner.xcodeproj/project.pbxproj
          
          # Distribution 인증서 설정 (Runner만)
          echo "📝 Runner 타겟: Apple Distribution 인증서 설정..."
          sed -i '' "s/CODE_SIGN_IDENTITY = \"\";/CODE_SIGN_IDENTITY = \"Apple Distribution\";/g" Runner.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_IDENTITY = \"Apple Development\";/CODE_SIGN_IDENTITY = \"Apple Distribution\";/g" Runner.xcodeproj/project.pbxproj
          sed -i '' "s/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = \"iPhone Developer\";/\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";/g" Runner.xcodeproj/project.pbxproj
          
          # Distribution 프로파일 설정 (Runner만) — 자동 생성된 프로파일 이름 사용
          echo "📝 Runner 타겟: Distribution 프로파일 설정 ($SIGNING_PROFILE_NAME)..."
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = \"\";/PROVISIONING_PROFILE_SPECIFIER = \"$SIGNING_PROFILE_NAME\";/g" Runner.xcodeproj/project.pbxproj

          # ExportOptions.plist 의 프로파일 이름도 동적으로 갱신 (하드코딩 제거)
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:io.iconcasting.picnic.app $SIGNING_PROFILE_NAME" ExportOptions.plist
          
          # Release 구성 설정
          if [ -f "Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme" ]; then
            echo "📝 Archive 스킴 Release 구성 설정..."
            sed -i '' 's/buildConfiguration = \"Debug\"/buildConfiguration = \"Release\"/g' Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          fi
          
          # Development 관련 설정 제거 (Runner만)
          echo "🧹 Runner 타겟: Development 관련 설정 제거..."
          sed -i '' "/CODE_SIGN_IDENTITY.*=.*iPhone Developer/d" Runner.xcodeproj/project.pbxproj
          sed -i '' "/CODE_SIGN_IDENTITY.*=.*Apple Development/d" Runner.xcodeproj/project.pbxproj
          sed -i '' "/PROVISIONING_PROFILE_SPECIFIER.*=.*Development/d" Runner.xcodeproj/project.pbxproj
          
          echo "✅ Pods 타겟들: Automatic signing 그대로 유지 (건드리지 않음)"
          echo "📝 이제 Runner는 Manual, CocoaPods는 Automatic signing 사용"
          
          echo "📋 Runner 설정 확인:"
          grep -n "CODE_SIGN_STYLE\|Apple Distribution\|PROVISIONING_PROFILE_SPECIFIER" Runner.xcodeproj/project.pbxproj | head -10
          
          echo "✅ 타겟별 서명 설정 완료"
          echo "📱 Runner 타겟: Manual Distribution Signing"
          echo "  - CODE_SIGN_STYLE: Manual"
          echo "  - DEVELOPMENT_TEAM: 24SL34R9HR"
          echo "  - CODE_SIGN_IDENTITY: Apple Distribution"
          echo "  - PROVISIONING_PROFILE_SPECIFIER: $SIGNING_PROFILE_NAME"
          echo "📦 CocoaPods 타겟들: Automatic Signing (변경 없음)"

      - name: Shorebird iOS Release and Build IPA
        script: |
          # Assert the *propagated* value too: an empty DEPLOY_TARGET would fall
          # into the staging branch of every test below and ship a staging IPA to
          # App Store Connect. `:?` exits a non-interactive shell on its own, so
          # this holds even though this step deliberately runs without `set -e`.
          : "${DEPLOY_TARGET:?was not propagated from the tag-derivation step}"
          export PATH="$HOME/.shorebird/bin:$PATH"
          cd picnic_app

          echo "=== Shorebird iOS 릴리즈 및 IPA 빌드 ==="
          echo ""

          echo "=== 현재 버전 확인 ==="
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          echo "📦 현재 버전: $VERSION"

          echo "=== Shorebird 인증 확인 ==="
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "❌ SHOREBIRD_TOKEN 환경변수가 설정되지 않았습니다"
            exit 1
          fi
          echo "✅ SHOREBIRD_TOKEN 설정됨"

          # CI 환경은 매번 깨끗하므로 cache clean 불필요
          # shorebird release가 자체적으로 빌드를 수행함

          # Xcode 캐시 정리 (Swift 심볼 에러 방지)
          echo "🧹 Xcode DerivedData 캐시 정리..."
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf build/ios

          echo "=== Shorebird iOS 릴리즈 시도 ==="
          echo "🚀 Shorebird로 iOS 빌드 + 릴리즈..."
          SHOREBIRD_RELEASE_SUCCESS=false

          # App.framework MinimumOSVersion 패치 함수
          # Xcode 26 + Flutter/Shorebird 빌드에서 App.framework Info.plist에
          # MinimumOSVersion이 누락되는 이슈 해결
          patch_app_framework() {
            local ARCHIVE_PATH="$1"
            local MIN_OS="${2:-15.0}"
            local APP_FW_PLIST="$ARCHIVE_PATH/Products/Applications/Runner.app/Frameworks/App.framework/Info.plist"

            if [ -f "$APP_FW_PLIST" ]; then
              CURRENT_MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_FW_PLIST" 2>/dev/null || echo "")
              if [ -z "$CURRENT_MIN_OS" ]; then
                echo "🔧 App.framework MinimumOSVersion 패치: $MIN_OS"
                /usr/libexec/PlistBuddy -c "Delete :MinimumOSVersion" "$APP_FW_PLIST" 2>/dev/null || true
                /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string $MIN_OS" "$APP_FW_PLIST"
                echo "✅ App.framework MinimumOSVersion 패치 완료"
              else
                echo "✅ App.framework MinimumOSVersion 이미 설정됨: $CURRENT_MIN_OS"
              fi
            else
              echo "⚠️ App.framework Info.plist을 찾을 수 없음: $APP_FW_PLIST"
            fi
          }

          # Shorebird release ios는 xcarchive를 생성함
          # --export-options-plist를 전달하여 IPA도 함께 생성
          if [ "$DEPLOY_TARGET" = "production" ]; then
            shorebird release ios \
              --dart-define=ENVIRONMENT=prod \
              --dart-define=PANGLE_ENVIRONMENT=prod \
              --dart-define=PAYMENT_ENVIRONMENT=prod \
              --no-confirm \
              --flutter-version=3.41.4 \
              -- --export-options-plist=ios/ExportOptions.plist 2>&1 | tee /tmp/shorebird_release.log
          else
            shorebird release ios \
              --dart-define=ENVIRONMENT=dev \
              --dart-define=PICNIC_STAGING_SUPABASE_PROJECT_REF=$PICNIC_STAGING_SUPABASE_PROJECT_REF \
              --dart-define=PANGLE_ENVIRONMENT=sandbox \
              --dart-define=PAYMENT_ENVIRONMENT=sandbox \
              --dart-define=PICNIC_PANGLE_IOS_APP_ID= \
              --dart-define=PICNIC_PANGLE_ANDROID_APP_ID= \
              --dart-define=PICNIC_PANGLE_IOS_REWARDED_ID= \
              --dart-define=PICNIC_PANGLE_ANDROID_REWARDED_ID= \
              --dart-define=PICNIC_PAYMENT_PRODUCT_NAMESPACE=$PICNIC_PAYMENT_PRODUCT_NAMESPACE \
              --dart-define=PICNIC_SANDBOX_USES_PRODUCTION_STORE_SKUS=true \
              --no-confirm \
              --flutter-version=3.41.4 \
              -- --export-options-plist=ios/ExportOptions.plist 2>&1 | tee /tmp/shorebird_release.log
          fi

          RELEASE_EXIT_CODE=${PIPESTATUS[0]}

          if [ $RELEASE_EXIT_CODE -ne 0 ]; then
            # 이미 릴리즈가 존재하는 경우 - Shorebird의 xcarchive에서 IPA 추출 시도
            if grep -q "existing.*release for version" /tmp/shorebird_release.log; then
              echo "⚠️ 이미 같은 버전의 릴리즈가 존재합니다"
              echo "📋 기존 릴리즈를 사용하여 IPA 빌드..."

              # shorebird release가 생성한 xcarchive 찾기
              XCARCHIVE=$(find build/ios/archive -name "*.xcarchive" -type d 2>/dev/null | head -1)

              if [ -n "$XCARCHIVE" ] && [ -d "$XCARCHIVE" ]; then
                echo "📦 Found xcarchive: $XCARCHIVE"
                patch_app_framework "$XCARCHIVE"
                echo "🔧 Exporting IPA from Shorebird xcarchive..."

                xcodebuild -exportArchive \
                  -archivePath "$XCARCHIVE" \
                  -exportPath build/ios/ipa \
                  -exportOptionsPlist ios/ExportOptions.plist

                SHOREBIRD_RELEASE_SUCCESS=true
              else
                echo "⚠️ Shorebird xcarchive를 찾을 수 없음"
                echo "📋 Fallback: shorebird build로 IPA 생성..."
              fi
            elif grep -q "Cannot find release build artifacts" /tmp/shorebird_release.log; then
              echo "⚠️ 아티팩트 문제 발생"
              echo "📋 Fallback: 새로운 shorebird release 시도..."
            else
              echo "❌ Shorebird iOS 릴리즈 실패 (종료 코드: $RELEASE_EXIT_CODE)"
              cat /tmp/shorebird_release.log
              exit 1
            fi
          else
            echo "✅ Shorebird iOS 릴리즈 성공"
            SHOREBIRD_RELEASE_SUCCESS=true
          fi

          # Shorebird release가 성공했으면, 해당 xcarchive에서 IPA 추출
          if [ "$SHOREBIRD_RELEASE_SUCCESS" = "true" ]; then
            echo "=== Shorebird xcarchive에서 IPA 추출 ==="

            # Shorebird가 생성한 xcarchive 찾기
            XCARCHIVE=$(find build/ios/archive -name "*.xcarchive" -type d 2>/dev/null | head -1)

            if [ -z "$XCARCHIVE" ] || [ ! -d "$XCARCHIVE" ]; then
              # 기본 Flutter 빌드 위치도 확인
              XCARCHIVE=$(find build -name "*.xcarchive" -type d 2>/dev/null | head -1)
            fi

            if [ -n "$XCARCHIVE" ] && [ -d "$XCARCHIVE" ]; then
              echo "📦 Found xcarchive: $XCARCHIVE"
              patch_app_framework "$XCARCHIVE"

              # Shorebird가 생성한 IPA는 패치 전이므로 삭제 후 재추출
              rm -f build/ios/ipa/*.ipa 2>/dev/null || true
              echo "🔧 Exporting IPA..."
              mkdir -p build/ios/ipa

              xcodebuild -exportArchive \
                -archivePath "$XCARCHIVE" \
                -exportPath build/ios/ipa \
                -exportOptionsPlist ios/ExportOptions.plist
            else
              echo "⚠️ xcarchive를 찾을 수 없어 flutter build ipa 실행..."
              # 이 경우는 패치가 작동하지 않을 수 있음 (경고 표시)
              echo "⚠️ WARNING: flutter build ipa로 생성된 IPA는 Shorebird 패치를 받을 수 없습니다!"
              if [ "$DEPLOY_TARGET" = "production" ]; then
                flutter build ipa \
                  --release \
                  --dart-define=ENVIRONMENT=prod \
                  --dart-define=PANGLE_ENVIRONMENT=prod \
                  --dart-define=PAYMENT_ENVIRONMENT=prod \
                  --export-options-plist=ios/ExportOptions.plist
              else
                flutter build ipa \
                  --release \
                  --dart-define=ENVIRONMENT=dev \
                  --dart-define=PICNIC_STAGING_SUPABASE_PROJECT_REF=$PICNIC_STAGING_SUPABASE_PROJECT_REF \
                  --dart-define=PANGLE_ENVIRONMENT=sandbox \
                  --dart-define=PAYMENT_ENVIRONMENT=sandbox \
                  --dart-define=PICNIC_PANGLE_IOS_APP_ID= \
                  --dart-define=PICNIC_PANGLE_ANDROID_APP_ID= \
                  --dart-define=PICNIC_PANGLE_IOS_REWARDED_ID= \
                  --dart-define=PICNIC_PANGLE_ANDROID_REWARDED_ID= \
                  --dart-define=PICNIC_PAYMENT_PRODUCT_NAMESPACE=$PICNIC_PAYMENT_PRODUCT_NAMESPACE \
                  --dart-define=PICNIC_SANDBOX_USES_PRODUCTION_STORE_SKUS=true \
                  --export-options-plist=ios/ExportOptions.plist
              fi
            fi
          else
            # Shorebird 릴리즈 실패 시 fallback (패치 작동 안함)
            echo "=== Fallback: flutter build ipa ==="
            echo "⚠️ WARNING: flutter build ipa로 생성된 IPA는 Shorebird 패치를 받을 수 없습니다!"
            if [ "$DEPLOY_TARGET" = "production" ]; then
              flutter build ipa \
                --release \
                --dart-define=ENVIRONMENT=prod \
                --dart-define=PANGLE_ENVIRONMENT=prod \
                --dart-define=PAYMENT_ENVIRONMENT=prod \
                --export-options-plist=ios/ExportOptions.plist
            else
              flutter build ipa \
                --release \
                --dart-define=ENVIRONMENT=dev \
                --dart-define=PICNIC_STAGING_SUPABASE_PROJECT_REF=$PICNIC_STAGING_SUPABASE_PROJECT_REF \
                --dart-define=PANGLE_ENVIRONMENT=sandbox \
                --dart-define=PAYMENT_ENVIRONMENT=sandbox \
                --dart-define=PICNIC_PANGLE_IOS_APP_ID= \
                --dart-define=PICNIC_PANGLE_ANDROID_APP_ID= \
                --dart-define=PICNIC_PANGLE_IOS_REWARDED_ID= \
                --dart-define=PICNIC_PANGLE_ANDROID_REWARDED_ID= \
                --dart-define=PICNIC_PAYMENT_PRODUCT_NAMESPACE=$PICNIC_PAYMENT_PRODUCT_NAMESPACE \
                --dart-define=PICNIC_SANDBOX_USES_PRODUCTION_STORE_SKUS=true \
                --export-options-plist=ios/ExportOptions.plist
            fi
          fi

          if [ ! -f "build/ios/ipa/"*.ipa ]; then
            echo "❌ IPA 빌드 실패"
            exit 1
          fi
          echo "✅ IPA 빌드 완료"

          # IPA 복사
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" -type f | head -1)
          if [ -n "$IPA_FILE" ]; then
            cp "$IPA_FILE" "../picnic_app.ipa"
            IPA_SIZE=$(stat -f%z "../picnic_app.ipa" 2>/dev/null || stat -c%s "../picnic_app.ipa" 2>/dev/null || echo "unknown")
            echo "✅ IPA 파일 준비 완료: $IPA_SIZE bytes"
          else
            echo "❌ IPA 파일을 찾을 수 없습니다"
            exit 1
          fi

          echo "=== 빌드 완료 ==="
          echo "📦 IPA 파일: picnic_app.ipa"
          echo "🚀 Shorebird 릴리즈: 완료"

      - name: Upload Debug Symbols to Sentry (iOS)
        script: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "⏭️ SENTRY_AUTH_TOKEN 미설정 - Sentry 업로드 건너뜀"
            exit 0
          fi

          cd picnic_app
          echo "=== Sentry 디버그 심볼 업로드 (iOS) ==="

          # sentry-cli 설치
          curl -sL https://sentry.io/get-cli/ | bash
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

          sentry-cli --version

          # 버전 정보 추출
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION" | cut -d'+' -f2)
          SENTRY_RELEASE="${BUNDLE_ID}@${VERSION}"

          echo "📦 Release: $SENTRY_RELEASE"
          echo "📦 Version: $VERSION_NAME / Build: $BUILD_NUMBER"

          # Sentry 릴리즈 생성
          sentry-cli releases new "$SENTRY_RELEASE" \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" 2>&1 || echo "ℹ️ 릴리즈 생성 실패 또는 이미 존재"

          # 1) iOS dSYM 업로드
          XCARCHIVE=$(find build/ios/archive -name "*.xcarchive" -type d 2>/dev/null | head -1)
          if [ -n "$XCARCHIVE" ] && [ -d "$XCARCHIVE/dSYMs" ]; then
            DSYM_COUNT=$(find "$XCARCHIVE/dSYMs" -name "*.dSYM" -type d 2>/dev/null | wc -l | tr -d ' ')
            echo "📤 dSYM 업로드: ${DSYM_COUNT}개 파일 ($XCARCHIVE/dSYMs)"
            sentry-cli debug-files upload \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              --include-sources \
              "$XCARCHIVE/dSYMs"
            echo "✅ dSYM 업로드 완료"
          else
            echo "⚠️ dSYM 디렉토리를 찾을 수 없습니다"
            echo "   검색된 xcarchive:"
            find build/ios -name "*.xcarchive" -type d 2>/dev/null || echo "   (없음)"
          fi

          # 2) Flutter/Dart 디버그 심볼 업로드 (DWARF debug info)
          echo "📤 Flutter 디버그 심볼 검색 및 업로드..."
          sentry-cli debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --include-sources \
            build/ios/ 2>&1 || echo "⚠️ Flutter 디버그 심볼 업로드 실패 (무시)"

          # 릴리즈 완료
          sentry-cli releases finalize "$SENTRY_RELEASE" \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" 2>&1 || true

          echo "✅ Sentry iOS 디버그 심볼 업로드 완료"

    artifacts:
      # 단일 IPA 파일 (중복 publishing 방지)
      - picnic_app.ipa                                    # 워크스페이스 루트 (가장 확실한 위치)
      - picnic_app/build/ios/archive/Runner.xcarchive    # Archive 파일
      - picnic_app/flutter_drive.log
      - picnic_app/build/ios/**/Runner.app

    publishing:
      # 하이브리드 배포: TestFlight + Shorebird 모두 사용
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
      slack:
        channel: '#codemagic-picnic'
        notify_on_build_start: true
        notify:
          success: true
          failure: true
      email:
        recipients:
          - ironlove77@gmail.com
        notify:
          success: true
          failure: true

  # =================== PICNIC APP Android ===================
  picnic-app-android:
    name: Picnic App - Android
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      android_signing:
        - picnic_keystore
      groups:
        - google_play
        - shorebird-config
        - picnic_env
        - sentry-config
      flutter: 3.41.4
      java: 17
      vars:
        PATH: $PATH:$HOME/.shorebird/bin
        APP_NAME: "picnic_app"
        # CodeMagic이 android_signing을 인식하도록 강제 설정
        FLUTTER_BUILD_MODE: "release"
        # 명시적 Flutter 버전 고정 (Shorebird 호환성)
        FLUTTER_VERSION: "3.41.4"
        ENABLE_SHOREBIRD: "true"
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.android/build-cache
        - $HOME/.android/build-cache
        - picnic_app/.dart_tool
        - picnic_app/android/.gradle
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'picnic-v*'
          include: true
        - pattern: 'picnic-staging-v*'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Derive the deploy target from the release tag
        script: |
          set -e
          # The tag decides the target, so there is no run-time variable a human
          # can forget to set:
          #   picnic-staging-v*  -> staging
          #   picnic-v*          -> production
          # The two patterns cannot both match the same tag: `picnic-staging-v1.2.3`
          # does not match `picnic-v*`.
          #
          # CM_TAG is Codemagic's built-in variable, documented as "The tag being
          # built if started from a tag webhook, unset otherwise", so requiring it
          # stops a non-tag build from guessing a target.
          # https://docs.codemagic.io/yaml-basic-configuration/environment-variables/
          : "${CM_TAG:?is unset; this workflow only runs from a release tag}"
          case "$CM_TAG" in
            picnic-staging-v*)
              DEPLOY_TARGET=staging
              ;;
            picnic-v*)
              DEPLOY_TARGET=production
              ;;
            *)
              echo "Tag '$CM_TAG' maps to no deploy target; expected picnic-v* or picnic-staging-v*" >&2
              exit 1
              ;;
          esac
          : "${DEPLOY_TARGET:?was not derived from the tag; refusing to guess a deploy target}"
          echo "DEPLOY_TARGET=$DEPLOY_TARGET" >> "$CM_ENV"
          echo "Deploy target: $DEPLOY_TARGET (from tag $CM_TAG)"
      - name: Verify environment isolation policy
        script: |
          set -e
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 test_codemagic_environment_isolation.py
          python3 test_codemagic_environment_isolation.py --self-test
      - name: Verify deployment target
        script: |
          # set -e: a NO-GO from the guard must fail the step, not be discarded.
          set -e
          # Assert the *propagated* value too. If the `$CM_ENV` hand-off from the
          # derivation step ever breaks, DEPLOY_TARGET is empty here and the test
          # below would silently take the staging branch.
          : "${DEPLOY_TARGET:?was not propagated from the tag-derivation step}"
          cd picnic_app
          if [ "$DEPLOY_TARGET" = "production" ]; then
            dart run tool/verify_release_target.dart --target=production
          else
            echo "Staging target selected; isolation is verified after config/dev.json is generated."
          fi
      - name: Run picnic_app release guard tests
        script: |
          set -e
          # The release-target and environment-isolation guards live in
          # picnic_app/test/config. picnic_lib's suite never loads them, so
          # without this step they would rot unnoticed until a release broke.
          # Runs after verify_release_target.dart on purpose: that guard requires
          # a clean checkout, and `flutter test` implies a pub get that can touch
          # the tracked pubspec.lock.
          cd picnic_app
          flutter test
      - name: Install Shorebird CLI
        script: |
          if [ "${ENABLE_SHOREBIRD:-false}" != "true" ]; then
            echo "⏭️ Skipping Shorebird (disabled)"
            exit 0
          fi
          echo "=== Shorebird CLI 설치 ==="
          rm -rf "$HOME/.shorebird"
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash

          # 바이너리 존재 확인만 (--version은 Flutter 다운로드로 오래 걸림)
          if [ -f "$HOME/.shorebird/bin/shorebird" ]; then
            echo "✅ Shorebird 설치 완료"
          else
            echo "❌ Shorebird 설치 실패"
            exit 1
          fi

      - name: Flutter Environment Setup
        script: |
          # set -e: verify_environment_isolation.dart below is not the last
          # command in this step, so without it a NO-GO exit status would be
          # overwritten by the trailing `flutter packages pub get` and the build
          # would keep going and publish a mis-targeted app.
          set -e
          # Assert the *propagated* value too: an empty DEPLOY_TARGET would take
          # the staging branch below instead of stopping the build.
          : "${DEPLOY_TARGET:?was not propagated from the tag-derivation step}"
          cd picnic_app
          echo "=== Flutter 환경 준비 ==="
          echo "🎯 Flutter + Shorebird 통합 빌드 시스템"
          echo ""
          echo "📝 통합 시스템 개요:"
          echo "- 표준 Flutter AAB 빌드 실행"
          echo "- Shorebird 릴리즈 업로드 (선택적)"
          echo "- Google Play와 Shorebird 패치 시스템 모두 지원"
          echo ""
          
          echo "=== Flutter 버전 확인 ==="
          flutter --version
          
          echo "=== Flutter 패키지 설치 ==="
          if [ "$DEPLOY_TARGET" != "production" ]; then
            : "${PICNIC_STAGING_SUPABASE_URL:?PICNIC_STAGING_SUPABASE_URL is required}"
            : "${PICNIC_STAGING_SUPABASE_ANON_KEY:?PICNIC_STAGING_SUPABASE_ANON_KEY is required}"
            : "${PICNIC_STAGING_SUPABASE_PROJECT_REF:?PICNIC_STAGING_SUPABASE_PROJECT_REF is required}"
            jq --arg url "$PICNIC_STAGING_SUPABASE_URL" \
              --arg key "$PICNIC_STAGING_SUPABASE_ANON_KEY" \
              '.supabase.url=$url | .supabase.anon_key=$key | .supabase.storage.url=($url + "/storage/v1") | .supabase.storage.anon_key=$key' \
              config/prod.json > config/dev.json
            PANGLE_ENVIRONMENT=sandbox \
              PAYMENT_ENVIRONMENT=sandbox \
              PICNIC_PANGLE_IOS_APP_ID= \
              PICNIC_PANGLE_ANDROID_APP_ID= \
              PICNIC_PANGLE_IOS_REWARDED_ID= \
              PICNIC_PANGLE_ANDROID_REWARDED_ID= \
              dart run tool/verify_environment_isolation.dart --environment=dev
          fi
          flutter packages pub get

      - name: Run unit tests with coverage
        script: |
          cd picnic_lib
          flutter test --coverage
          python3 scripts/filter_coverage.py \
            --exclude-list coverage/exclude_patterns.txt \
            --input coverage/lcov.info \
            --output coverage/lcov_filtered.info
        test_report: picnic_lib/build/test-results/**/*.xml

      - name: Verify Keystore Configuration
        script: |
          echo "=== 키스토어 환경 변수 확인 ==="
          echo "CM_KEYSTORE_PATH: ${CM_KEYSTORE_PATH:-'미설정'}"
          echo "CM_KEYSTORE_PASSWORD: ${CM_KEYSTORE_PASSWORD:-'미설정'}"
          echo "CM_KEY_ALIAS: ${CM_KEY_ALIAS:-'미설정'}"
          echo "CM_KEY_PASSWORD: ${CM_KEY_PASSWORD:-'미설정'}"
          
          if [ -z "$CM_KEYSTORE_PATH" ] || [ -z "$CM_KEYSTORE_PASSWORD" ] || [ -z "$CM_KEY_ALIAS" ] || [ -z "$CM_KEY_PASSWORD" ]; then
            echo "❌ 키스토어 환경 변수가 올바르게 설정되지 않았습니다"
            echo "CodeMagic 대시보드에서 'picnic_keystore' 그룹 설정을 확인해주세요"
            exit 1
          fi
          
          if [ -f "$CM_KEYSTORE_PATH" ]; then
            echo "✅ 키스토어 파일 존재: $CM_KEYSTORE_PATH"
            # 키스토어 정보 확인
            keytool -list -v -keystore "$CM_KEYSTORE_PATH" -alias "$CM_KEY_ALIAS" -storepass "$CM_KEYSTORE_PASSWORD" | grep -E "(SHA1|SHA256|Subject|Issuer)" || echo "키스토어 정보 확인 실패"
          else
            echo "❌ 키스토어 파일을 찾을 수 없습니다: $CM_KEYSTORE_PATH"
            exit 1
          fi

      - name: Shorebird Android Release and Build AAB
        script: |
          # Assert the *propagated* value too: an empty DEPLOY_TARGET would fall
          # into the staging branch of every test below and ship a staging AAB to
          # Google Play. `:?` exits a non-interactive shell on its own, so this
          # holds even though this step deliberately runs without `set -e`.
          : "${DEPLOY_TARGET:?was not propagated from the tag-derivation step}"
          export PATH="$HOME/.shorebird/bin:$PATH"
          cd picnic_app

          echo "=== Shorebird Android 릴리즈 및 AAB 빌드 ==="
          echo ""

          echo "=== Gradle 메모리 설정 ==="
          mkdir -p $HOME/.gradle
          cat > $HOME/.gradle/gradle.properties << 'GRADLE'
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.daemon=true
          android.enableJetifier=true
          android.useAndroidX=true
          GRADLE

          echo "=== Shorebird 버전 확인 ==="
          shorebird --version

          echo "=== Shorebird 인증 확인 ==="
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "❌ SHOREBIRD_TOKEN 환경변수가 설정되지 않았습니다"
            exit 1
          fi
          echo "✅ SHOREBIRD_TOKEN 설정됨"

          echo "=== 현재 버전 확인 ==="
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          echo "📦 현재 버전: $VERSION"

          # CI 환경은 매번 깨끗하므로 cache clean 불필요
          # shorebird release가 자체적으로 빌드를 수행함

          echo "=== Shorebird Android 릴리즈 시도 ==="
          echo "🚀 Shorebird로 Android 빌드 + 릴리즈..."
          SKIP_SHOREBIRD=false

          if [ "$DEPLOY_TARGET" = "production" ]; then
            shorebird release android \
              --dart-define=ENVIRONMENT=prod \
              --dart-define=PANGLE_ENVIRONMENT=prod \
              --dart-define=PAYMENT_ENVIRONMENT=prod \
              --no-confirm \
              --flutter-version=3.41.4 \
              --verbose 2>&1 | tee /tmp/shorebird_release.log
          else
            shorebird release android \
              --dart-define=ENVIRONMENT=dev \
              --dart-define=PICNIC_STAGING_SUPABASE_PROJECT_REF=$PICNIC_STAGING_SUPABASE_PROJECT_REF \
              --dart-define=PANGLE_ENVIRONMENT=sandbox \
              --dart-define=PAYMENT_ENVIRONMENT=sandbox \
              --dart-define=PICNIC_PANGLE_IOS_APP_ID= \
              --dart-define=PICNIC_PANGLE_ANDROID_APP_ID= \
              --dart-define=PICNIC_PANGLE_IOS_REWARDED_ID= \
              --dart-define=PICNIC_PANGLE_ANDROID_REWARDED_ID= \
              --dart-define=PICNIC_PAYMENT_PRODUCT_NAMESPACE=$PICNIC_PAYMENT_PRODUCT_NAMESPACE \
              --dart-define=PICNIC_SANDBOX_USES_PRODUCTION_STORE_SKUS=true \
              --no-confirm \
              --flutter-version=3.41.4 \
              --verbose 2>&1 | tee /tmp/shorebird_release.log
          fi

          RELEASE_EXIT_CODE=${PIPESTATUS[0]}

          if [ $RELEASE_EXIT_CODE -ne 0 ]; then
            echo "⚠️ Shorebird 릴리즈 실패 (종료 코드: $RELEASE_EXIT_CODE)"
            echo "=== Shorebird 오류 로그 ==="
            cat /tmp/shorebird_release.log
            echo "=== 오류 로그 끝 ==="

            # 이미 릴리즈가 존재하거나 아티팩트를 찾을 수 없는 경우 Flutter 빌드로 폴백
            if grep -q "existing.*release for version" /tmp/shorebird_release.log || \
               grep -q "Cannot find release build artifacts" /tmp/shorebird_release.log; then
              echo "📋 Shorebird 릴리즈를 건너뛰고 Flutter AAB 빌드로 진행합니다"
              SKIP_SHOREBIRD=true
            else
              echo "❌ 복구 불가능한 오류입니다"
              exit 1
            fi
          else
            echo "✅ Shorebird Android 릴리즈 성공"
          fi

          echo "=== AAB 파일 확인 및 빌드 ==="
          # Shorebird가 성공적으로 AAB를 생성했는지 확인
          SHOREBIRD_AAB_EXISTS=false
          if [ "$SKIP_SHOREBIRD" = "false" ] && [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "✅ Shorebird 릴리즈에서 AAB 생성됨"
            SHOREBIRD_AAB_EXISTS=true
          fi

          # Shorebird를 건너뛴 경우 또는 AAB가 없는 경우 Flutter 빌드 실행
          if [ "$SHOREBIRD_AAB_EXISTS" = "false" ]; then
            echo "⚠️ WARNING: flutter build appbundle로 생성된 AAB는 Shorebird 패치를 받을 수 없습니다!"
            echo "📦 Flutter AAB 빌드 (fallback)..."
            if [ "$DEPLOY_TARGET" = "production" ]; then
              flutter build appbundle \
                --release \
                --dart-define=ENVIRONMENT=prod \
                --dart-define=PANGLE_ENVIRONMENT=prod \
                --dart-define=PAYMENT_ENVIRONMENT=prod
            else
              flutter build appbundle \
                --release \
                --dart-define=ENVIRONMENT=dev \
                --dart-define=PICNIC_STAGING_SUPABASE_PROJECT_REF=$PICNIC_STAGING_SUPABASE_PROJECT_REF \
                --dart-define=PANGLE_ENVIRONMENT=sandbox \
                --dart-define=PAYMENT_ENVIRONMENT=sandbox \
                --dart-define=PICNIC_PANGLE_IOS_APP_ID= \
                --dart-define=PICNIC_PANGLE_ANDROID_APP_ID= \
                --dart-define=PICNIC_PANGLE_IOS_REWARDED_ID= \
                --dart-define=PICNIC_PANGLE_ANDROID_REWARDED_ID= \
                --dart-define=PICNIC_PAYMENT_PRODUCT_NAMESPACE=$PICNIC_PAYMENT_PRODUCT_NAMESPACE \
                --dart-define=PICNIC_SANDBOX_USES_PRODUCTION_STORE_SKUS=true
            fi

            if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
              echo "✅ AAB 빌드 완료 (Shorebird 패치 미지원)"
            else
              echo "❌ AAB 파일을 생성할 수 없습니다"
              exit 1
            fi
          fi

          AAB_SIZE=$(stat -f%z "build/app/outputs/bundle/release/app-release.aab" 2>/dev/null || stat -c%s "build/app/outputs/bundle/release/app-release.aab" 2>/dev/null || echo "unknown")
          echo "📦 AAB 파일 크기: $AAB_SIZE bytes"

          echo "=== 빌드 완료 ==="
          echo "📦 AAB 파일: build/app/outputs/bundle/release/app-release.aab"

      - name: Verify AAB Output
        script: |
          cd picnic_app
          echo "=== AAB 출력 확인 ==="
          echo "🎯 통합 빌드 시스템의 AAB 파일들 확인"
          echo ""
          
          echo "📝 통합 시스템 설명:"
          echo "- 표준 Flutter 빌드로 Google Play 배포용 AAB 생성"
          echo "- Shorebird 릴리즈로 패치 시스템 지원"
          echo "- 두 시스템 모두 동일한 AAB 파일 사용"
          echo ""
          
          # Flutter가 기대하는 위치의 app.aab 확인
          if [ -f "build/app/outputs/bundle/release/app.aab" ]; then
            APP_AAB_SIZE=$(stat -f%z "build/app/outputs/bundle/release/app.aab" 2>/dev/null || echo "unknown")
            echo "✅ Flutter용 AAB 파일: build/app/outputs/bundle/release/app.aab (${APP_AAB_SIZE} bytes)"
          else
            echo "⚠️ Flutter용 app.aab 파일을 찾을 수 없음"
          fi
          
          # 표준 app-release.aab 확인
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            APP_RELEASE_AAB_SIZE=$(stat -f%z "build/app/outputs/bundle/release/app-release.aab" 2>/dev/null || echo "unknown")
            echo "✅ 표준 AAB 파일: build/app/outputs/bundle/release/app-release.aab (${APP_RELEASE_AAB_SIZE} bytes)"
          else
            echo "⚠️ 표준 app-release.aab 파일을 찾을 수 없음"
          fi
          
          # 원본 Gradle 출력 위치 확인
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            GRADLE_AAB_SIZE=$(stat -f%z "android/app/build/outputs/bundle/release/app-release.aab" 2>/dev/null || echo "unknown")
            echo "✅ Gradle 원본 AAB 파일: android/app/build/outputs/bundle/release/app-release.aab (${GRADLE_AAB_SIZE} bytes)"
          else
            echo "⚠️ Gradle 원본 AAB 파일을 찾을 수 없음"
          fi
          
          echo ""
          echo "🔍 모든 AAB 파일 위치:"
          find . -name "*.aab" -type f 2>/dev/null | while read aab_file; do
            aab_size=$(stat -f%z "$aab_file" 2>/dev/null || echo "unknown")
            echo "  📦 $aab_file (${aab_size} bytes)"
          done
          
          echo ""
          # 최소 하나의 AAB 파일이 있는지 확인
          AAB_COUNT=$(find . -name "*.aab" -type f 2>/dev/null | wc -l)
          if [ "$AAB_COUNT" -gt 0 ]; then
            echo "✅ 통합 빌드 시스템 성공: ${AAB_COUNT}개의 AAB 파일이 생성되었습니다"
            echo "🎯 Google Play 배포와 Shorebird 패치 시스템 모두 지원 가능"
          else
            echo "❌ AAB 파일이 전혀 생성되지 않았습니다"
            echo "🔍 빌드 과정을 다시 확인하세요"
            exit 1
          fi

      - name: Upload Debug Symbols to Sentry (Android)
        script: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "⏭️ SENTRY_AUTH_TOKEN 미설정 - Sentry 업로드 건너뜀"
            exit 0
          fi

          cd picnic_app
          echo "=== Sentry 디버그 심볼 업로드 (Android) ==="

          # sentry-cli 설치
          curl -sL https://sentry.io/get-cli/ | bash
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

          sentry-cli --version

          # 버전 정보 추출
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION" | cut -d'+' -f2)
          APP_PACKAGE="io.iconcasting.picnic.app"
          SENTRY_RELEASE="${APP_PACKAGE}@${VERSION}"

          echo "📦 Release: $SENTRY_RELEASE"
          echo "📦 Version: $VERSION_NAME / Build: $BUILD_NUMBER"

          # Sentry 릴리즈 생성
          sentry-cli releases new "$SENTRY_RELEASE" \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" 2>&1 || echo "ℹ️ 릴리즈 생성 실패 또는 이미 존재"

          # 1) ProGuard/R8 매핑 파일 업로드
          MAPPING_FILE=$(find build -name "mapping.txt" -type f 2>/dev/null | head -1)
          if [ -n "$MAPPING_FILE" ]; then
            echo "📤 ProGuard 매핑 업로드: $MAPPING_FILE"
            sentry-cli upload-proguard \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              --android-manifest "android/app/src/main/AndroidManifest.xml" \
              "$MAPPING_FILE"
            echo "✅ ProGuard 매핑 업로드 완료"
          else
            echo "⚠️ ProGuard 매핑 파일을 찾을 수 없습니다 (R8 미사용 또는 경로 다름)"
          fi

          # 2) 네이티브 디버그 심볼 업로드 (NDK .so 파일)
          NATIVE_LIBS_DIR=$(find build -path "*/merged_native_libs/release/out/lib" -type d 2>/dev/null | head -1)
          if [ -n "$NATIVE_LIBS_DIR" ]; then
            echo "📤 네이티브 라이브러리 디버그 심볼 업로드: $NATIVE_LIBS_DIR"
            sentry-cli debug-files upload \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              "$NATIVE_LIBS_DIR"
            echo "✅ 네이티브 심볼 업로드 완료"
          else
            echo "⚠️ 네이티브 라이브러리 디렉토리를 찾을 수 없습니다"
          fi

          # 3) Flutter/Dart 디버그 심볼 업로드 (DWARF debug info)
          echo "📤 Flutter 디버그 심볼 검색 및 업로드..."
          sentry-cli debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --include-sources \
            build/app/ 2>&1 || echo "⚠️ Flutter 디버그 심볼 업로드 실패 (무시)"

          # 릴리즈 완료
          sentry-cli releases finalize "$SENTRY_RELEASE" \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" 2>&1 || true

          echo "✅ Sentry Android 디버그 심볼 업로드 완료"

    artifacts:
      # Google Play 배포용 AAB 파일
      - picnic_app/build/app/outputs/bundle/release/app-release.aab  # 메인 배포용
      - picnic_app/build/**/outputs/**/*.apk
      - picnic_app/flutter_drive.log
      - picnic_app/build/app/outputs/**/mapping.txt

    publishing:
      # 조건부 Google Play 배포 (환경변수로 제어)
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # false → Play Console 수동 처리 없이 internal 트랙으로 바로 게시
        # (draft 로 올려 콘솔에서 승격하던 방식 폐기, rakitten 과 동일)
        submit_as_draft: false
      slack:
        channel: '#codemagic-picnic'
        notify_on_build_start: true
        notify:
          success: true
          failure: true
      email:
        recipients:
          - ironlove77@gmail.com
        notify:
          success: true
          failure: true

  # =================== PICNIC APP iOS Patch (Shorebird) ===================
  picnic-app-patch-ios:
    name: Picnic App - iOS Patch (Shorebird)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - shorebird-config
        - picnic_env
        - sentry-config
      flutter: 3.41.4
      xcode: 26.3
      cocoapods: default
      vars:
        APP_NAME: "picnic_app"
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
    # Production patches are manual and require protected exact-SHA evidence.
    scripts:
      - name: Verify protected production target
        script: |
          # set -e: a NO-GO from the guard must fail the step, not be discarded.
          set -e
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          cd picnic_app
          dart run tool/verify_release_target.dart --target=production
      - name: Setup and Patch iOS
        script: |
          echo "=== Shorebird iOS 패치 ==="
          echo "🎯 OTA 업데이트 배포 (앱 서명 불필요)"
          echo ""

          # 1. Shorebird CLI 설치
          echo "📥 Shorebird CLI 설치..."
          if [ -d "$HOME/.shorebird" ]; then
            rm -rf "$HOME/.shorebird"
          fi
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          export PATH="$HOME/.shorebird/bin:$PATH"

          shorebird --version
          echo "✅ Shorebird 설치 완료"

          # 2. 인증 확인
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "❌ SHOREBIRD_TOKEN 환경변수가 설정되지 않았습니다"
            exit 1
          fi
          echo "✅ SHOREBIRD_TOKEN 설정됨"

          # 3. Flutter 환경 준비
          cd picnic_app

          echo "📦 Flutter 패키지 설치..."
          flutter pub get

          echo "📦 CocoaPods 설치..."
          cd ios && pod install && cd ..

          # 4. iOS 패치 생성 및 배포
          echo "🚀 iOS 패치 생성 중..."
          echo "💡 패치는 Dart 코드만 업데이트하므로 코드 서명이 불필요합니다"

          # pubspec.yaml에서 전체 버전 추출 (빌드 번호 포함).
          # Shorebird 릴리스는 전체 버전(예: 1.2.39+123904)으로 등록되므로
          # 빌드 번호를 잘라내면 릴리스를 찾지 못해 패치가 실패한다.
          RELEASE_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "📦 패치 대상 버전: $RELEASE_VERSION"

          shorebird patch ios \
            --release-version=$RELEASE_VERSION \
            --no-confirm \
            --allow-native-diffs \
            --allow-asset-diffs \
            --dart-define=ENVIRONMENT=prod \
            --dart-define=PANGLE_ENVIRONMENT=prod \
            --dart-define=PAYMENT_ENVIRONMENT=prod \
            --verbose \
            -- --no-codesign

          PATCH_EXIT_CODE=$?

          if [ $PATCH_EXIT_CODE -eq 0 ]; then
            echo "=== iOS 패치 성공 ==="
            echo "✅ iOS 패치가 Shorebird를 통해 배포되었습니다"
            echo "🚀 사용자들은 앱 재시작 시 자동으로 패치가 적용됩니다"
          else
            echo "=== iOS 패치 실패 ==="
            echo "❌ 종료 코드: $PATCH_EXIT_CODE"
            echo "💡 확인사항:"
            echo "  - 기존 릴리즈가 Shorebird에 등록되어 있는지 확인"
            echo "  - Flutter 버전 호환성 확인 (현재: 3.41.4)"
            exit 1
          fi

      - name: Sentry 패치 디버그 심볼 업로드 (iOS)
        script: |
          # Shorebird patch 가 새로 빌드한 Dart AOT 코드는 release 빌드와
          # 다른 debug-id 를 가진다. release 시 업로드된 심볼만 갖고는
          # OTA 패치 후 발생한 ANR/crash 가 unsymbolicated `_updater/patches/N/dlc.vmcode`
          # 로 기록되어 분석 불가 (PICNIC-APP-45E 의 원인).
          # 따라서 patch 빌드 직후에도 symbol 업로드를 수행한다.

          set -e
          cd picnic_app

          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "⚠️ Sentry 환경변수 누락 — symbol 업로드 건너뜀"
            exit 0
          fi

          # sentry-cli 설치
          curl -sL https://sentry.io/get-cli/ | bash
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          sentry-cli --version || { echo "⚠️ sentry-cli 설치 실패"; exit 0; }

          # iOS dSYM (xcarchive 가 있으면)
          XCARCHIVE=$(find build/ios/archive -name "*.xcarchive" -type d 2>/dev/null | head -1)
          if [ -n "$XCARCHIVE" ] && [ -d "$XCARCHIVE/dSYMs" ]; then
            echo "📤 iOS dSYM 업로드: $XCARCHIVE/dSYMs"
            sentry-cli debug-files upload \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              --include-sources \
              "$XCARCHIVE/dSYMs" 2>&1 || echo "⚠️ dSYM 업로드 실패 (무시)"
          else
            echo "ℹ️ xcarchive 미발견 — Shorebird patch 는 일반적으로 archive 를 만들지 않음"
          fi

          # Flutter Dart AOT debug info (build/ios 전체 스캔)
          echo "📤 Flutter Dart 심볼 업로드..."
          sentry-cli debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --include-sources \
            build/ios/ 2>&1 || echo "⚠️ Flutter 심볼 업로드 실패 (무시)"

          echo "✅ Sentry iOS patch 심볼 업로드 단계 완료"

    artifacts:
      - picnic_app/flutter_drive.log

    publishing:
      slack:
        channel: '#codemagic-picnic'
        notify_on_build_start: true
        notify:
          success: true
          failure: true
      email:
        recipients:
          - ironlove77@gmail.com
        notify:
          success: true
          failure: true



  # =================== PICNIC APP Android Patch (Shorebird) ===================
  picnic-app-patch-android:
    name: Picnic App - Android Patch (Shorebird)
