    # Production patches are manual and require protected exact-SHA evidence.
    scripts:
      - name: Verify protected production target
        script: |
          # set -e: a NO-GO from the guard must fail the step, not be discarded.
          set -e
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          cd picnic_app
          dart run tool/verify_release_target.dart --target=production
      - name: Setup and Patch Android
        script: |
