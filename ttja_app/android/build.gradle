allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            name "Tapjoy's maven repo"
            url "https://sdk.tapjoy.com/"
        }
        maven { url 'https://artifact.bytedance.com/repository/pangle' }
        maven { url "https://jitpack.io" }
        maven { url "https://www.jitpack.io" }
    }
}

// Match Picnic's AGP 8 compatibility for shared legacy plugins.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def android = project.android
            if (android.namespace == null || android.namespace.isEmpty()) {
                def manifest = file("${project.projectDir}/src/main/AndroidManifest.xml")
                if (manifest.exists()) {
                    def pkg = new groovy.util.XmlSlurper().parse(manifest).@package.toString()
                    if (pkg) {
                        android.namespace = pkg
                    }
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

buildscript {
    ext.kotlin_version = '2.4.21'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.google.gms:google-services:4.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
