name: picnic_app
description: "Picnic App"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.20+122007

environment:
    sdk: '>=3.3.1 <4.0.0'

dependencies:
    flutter:
        sdk: flutter
    flutter_localizations:
        sdk: flutter
    cupertino_icons: ^1.0.2
    picnic_lib:
        path: ../picnic_lib
    intl: ^0.20.2
    screen_protector: ^1.4.5
    supabase_flutter: ^2.10.3
    universal_platform: ^1.1.0
    flutter_screenutil: ^5.9.3
    overlay_support: ^2.1.0
    flutter_riverpod: ^3.0.3
    app_links: ^6.4.1
    another_flutter_splash_screen: ^1.2.1
    device_info_plus: ^12.3.0
    firebase_core: ^4.2.1
    sentry_flutter: ^9.0.0

    firebase_analytics: ^12.0.4
    flutter_secure_storage: ^9.2.3
    timezone: ^0.10.0
    freezed_annotation: ^3.1.0
    riverpod_annotation: ^3.0.3
    supabase_extensions: ^1.0.1
    flutter_svg: ^2.0.16
    tapjoy_offerwall: ^14.6.0
    flutter_branch_sdk: ^8.3.2
    network_info_plus: ^7.0.0
    # firebase_crashlytics: ^5.0.0
    shorebird_code_push: ^2.0.3
    restart_app: ^1.2.1
    stack_trace: ^1.11.1
    flutter_native_splash: ^2.4.6
    flutter_phoenix: ^1.1.1
    fluwx: ^5.7.1
    
dev_dependencies:
    build_runner: ^2.4.13
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    json_serializable: ^6.9.0
    freezed: ^3.2.3
    riverpod_generator: ^3.0.3
    # riverpod_lint는 analyzer 7.x를 요구하는 버전과 충돌하므로 앱에서는 제거

flutter_intl:
    enabled: true

dependency_overrides:
flutter:
    uses-material-design: true
    generate: true
    assets:
        - config/
        - assets/login/
        - assets/splash.webp
        - assets/app_icon_128.png
        - shorebird.yaml
